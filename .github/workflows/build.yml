name: Build Drivkano Mega Drive ROM
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rhargreaves/docker-sgdk:v2.00
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM with SGDK
        run: make -f "$GDK/makefile.gen"
      - uses: actions/upload-artifact@v4
        with:
          name: Drivkano-ROM-and-source
          path: |
            out/**
            src/**
            res/**
            README.md
            Makefile
          if-no-files-found: error
