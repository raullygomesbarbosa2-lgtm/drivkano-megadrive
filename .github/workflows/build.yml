name: Build Drivkano Mega Drive ROM
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM with SGDK container
        run: docker run --rm -v "$GITHUB_WORKSPACE:/m68k" -w /m68k ghcr.io/rhargreaves/docker-sgdk:v2.00
      - uses: actions/upload-artifact@v4
        with:
          name: Drivkano-ROM-and-source
          path: |
            out/**
            src/**
            res/**
            README.md
            Makefile
          if-no-files-found: error
